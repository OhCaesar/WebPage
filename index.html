<style>
    body{

.rectangle{

}


#instagram_icon{
    color: black;
    pointer-events: fill;
}
#instagram_icon:hover{
    animation-name: color-switch-instagram;
    animation-duration: 4s;
    animation-iteration-count: infinite;
}

#git_icon{
    color: black;
    pointer-events: fill;
}
#git_icon:hover{
    animation-name: color-switch-git;
    animation-duration: 4s;
    animation-iteration-count: infinite;
}


#mail_icon{
    color: black;
    pointer-events: fill;
}
#mail_icon:hover{
    animation-name: color-switch-mail;
    animation-duration: 4s;
    animation-iteration-count: infinite;
}


@keyframes color-switch-git {
  0%   {color: orange;}
  50%   {color: red;}
  100%   {color: orange;}
}

@keyframes color-switch-instagram {
  0%   {color: blue;}
  25%   {color: blueviolet;}
  50%   {color: pink;}
  75%   {color: violet;}
  100%   {color: blue;}

}

@keyframes color-switch-mail {
  0%   {color: green;}
  50%   {color: rgb(0, 255, 38);}
  100%   {color: green;}

}
